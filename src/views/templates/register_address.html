==<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title> Sua Empresa - Endereço </title>
        <link rel="stylesheet" href="{{ url_for('static', filename='register_address.css') }}">
    </head>

    <body>
        <div class="layout-container">
            
            <aside class="sidebar">
                <div class="menu-icon">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </aside>

            <main class="main-content">
                
                <header>
                    <h1 class="company-title">Sua empresa</h1>
                    <div class="settings-icon">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                </header>

                <section class="form-area">
                    <h2 class="form-title">Informações de Endereço</h2>

                    <form class="address-form" method="POST">
                        
                        <div class="form-row">
                            <label for="estado">Estado:</label>
                            <input type="text" id="estado" name="estado">
                        </div>

                        <div class="form-row">
                            <label for="cidade">Cidade:</label>
                            <input type="text" id="cidade" name="cidade">
                        </div>

                        <div class="form-row">
                            <label for="bairro">Bairro:</label>
                            <input type="text" id="bairro" name="bairro">
                        </div>

                        <div class="form-row">
                            <label for="rua">Rua:</label>
                            <input type="text" id="rua" name="rua">
                        </div>

                        <div class="form-row">
                            <label for="numero">Número:</label>
                            <input type="text" id="numero" name="numero">
                        </div>

                        <div class="form-row">
                            <label for="cep">CEP:</label>
                            <input type="text" id="cep" name="cep">
                        </div>

                        <div class="form-row">
                            <label for="complemento">Complemento:</label>
                            <input type="text" id="complemento" name="complemento">
                        </div>

                        <div class="action-footer">
                            <button class="btn-save">Salvar</button>
                        </div>

                    </form>
                </section>

                
            </main>
        </div>
    </body>
</html>
