<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Produtos | BotVendas</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <aside class="sidebar">
            <div class="profile-section">
                <img src="../static/perfil.jpg" class="profile-img" alt="Perfil">
                <p>Minha conta</p>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="dashboard.html"><i class="fas fa-home"></i> Início</a></li>
                    <li><a href="empresa.html"><i class="fas fa-building"></i> Sua empresa</a></li>
                    <li class="active"><a href="produtos.html"><i class="fas fa-box"></i> Produtos</a></li>
                    <li><a href="desempenho.html"><i class="fas fa-chart-line"></i> Desempenho</a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> Configurações</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header-top">
                <h1>Catálogo de produtos</h1>
                <div class="search-bar-row">
                    <div class="search-group">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Pesquisar produto...">
                        <i class="fas fa-filter"></i>
                    </div>
                    <div class="button-group">
                        <button class="btn-primary">Cadastrar novo produto</button>
                        <button class="btn-primary">Gerenciar estoque</button>
                    </div>
                </div>
            </header>

            <div class="products-grid">
                <div class="product-card">
                    <div class="product-img-box">
                        <i class="fas fa-headphones fa-2x" style="color: #2D8B7E;"></i>
                    </div>
                    <h3>Produto A</h3>
                    <p class="price">R$ 10,00</p>
                    <button class="btn-edit">Editar</button>
                </div>
                <div class="product-card">
                    <div class="product-img-box">
                        <i class="fas fa-headphones fa-2x" style="color: #2D8B7E;"></i>
                    </div>
                    <h3>Produto B</h3>
                    <p class="price">R$ 15,00</p>
                    <button class="btn-edit">Editar</button>
                </div>
                </div>
        </main>
    </div>
</body>
</html>
